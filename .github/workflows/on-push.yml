name: On Branch Update
on:
  push:
    branches:
      - master
      - '**'

permissions:
  contents: read
  id-token: write # for QLTY code coverage (https://docs.qlty.sh/migration/coverage)

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npx eslint .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with coverage
        run: npm run test:cov

      - uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run E2E Tests
        run: npm run test:e2e

  # Check name: `Create Release / release`. The shared workflow only releases on master and does nothing on other
  # branches. Auto release mode: every releasable push to master becomes a full release.
  release:
    name: Create Release
    needs:
      - lint
      - test
      - e2e
    uses: Aam-Digital/.github/.github/workflows/release.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      contents: read # everything that writes uses the GH_TOKEN PAT (its releases trigger the image build)
    with:
      type: release
    secrets:
      token: ${{ secrets.GH_TOKEN }}
