name: On Semantic Release (build & publish image)

on:
  release:
    types: [published]

permissions: {}

jobs:
  # Check names: `build / build (linux/amd64)`, `build / build (linux/arm64)`, `build / merge`
  build:
    uses: Aam-Digital/.github/.github/workflows/docker-image.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      images: ghcr.io/aam-digital/replication-backend
      # Tag `<version>`; full releases also `stable` and `latest`.
      # The version is also recorded as the `org.opencontainers.image.version` label, which says which release an
      # image is (the floating tags don't). ndb-setup's update scripts read it to refuse an upgrade they cannot
      # verify is safe:
      #   docker inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' <container>
      version: ${{ github.event.release.tag_name }}
      stable: ${{ !github.event.release.prerelease }}
      labels: |
        org.opencontainers.image.description=A proxy that implements the CouchDB replication protocol
      # package.json's version is what the app reports (e.g. to Sentry)
      prepare: npm version "$VERSION" --no-git-tag-version --allow-same-version

  # After a full release, the edge images (`*-edge.*`) of the finished cycle are no longer needed. The image `edge`
  # points to is kept.
  prune-edge-images:
    if: ${{ !github.event.release.prerelease }}
    needs: build
    uses: Aam-Digital/.github/.github/workflows/image-cleanup.yml@v1
    permissions:
      actions: write
      packages: write
    with:
      tags: "*-edge.*"
