name: On Semantic Release (build & publish image)

on:
  release:
    types: [released]

jobs:
  build_and_publish:
    name: Build and publish replication-backend package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The release tag without its `v` prefix, so image tags are plain versions
      # (e.g. `1.13.0`) like those of ndb-core.
      - name: Determine version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Inject release version into package.json
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          context: ./
          push: true
          # `stable` alongside `latest`, like ndb-core's; `released` excludes prereleases.
          tags: |
            ghcr.io/aam-digital/replication-backend:${{ env.VERSION }}
            ghcr.io/aam-digital/replication-backend:stable
            ghcr.io/aam-digital/replication-backend:latest
