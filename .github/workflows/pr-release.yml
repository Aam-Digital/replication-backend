name: On PR (build & publish pre-release image)
on:
  pull_request:

jobs:
  build_and_publish_branch:
    name: Build and publish pr image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Inject PR version into package.json
        run: npm version "0.0.0-pr.${{ github.event.number }}" --no-git-tag-version --allow-same-version

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          context: ./
          push: true
          # Same annotations as the release build, so a pr- image is identifiable too. The version
          # mirrors the one injected into package.json above.
          labels: |
            org.opencontainers.image.version=0.0.0-pr.${{ github.event.number }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=replication-backend
            org.opencontainers.image.description=A proxy that implements the CouchDB replication protocol
            org.opencontainers.image.licenses=GPL-3.0
          tags: ghcr.io/aam-digital/replication-backend:pr-${{ github.event.number }}
