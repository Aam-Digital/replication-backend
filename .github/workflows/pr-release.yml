name: On PR (build & publish pre-release image)
on:
  pull_request:

jobs:
  # Check name: `build / build`
  build:
    needs: cleanup-test # TEMP
    uses: Aam-Digital/.github/.github/workflows/docker-image.yml@feat/reusable-workflows
    permissions:
      contents: read
      packages: write
    with:
      images: ghcr.io/aam-digital/replication-backend
      tags: pr-${{ github.event.number }}
      platforms: linux/amd64
      # PRs from forks cannot push; only check that the image builds
      push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      # The version label (and package.json version, which Sentry reports) stays semver for PR images,
      # so that ndb-setup's update scripts can compare it (see on-release.yml).
      labels: |
        org.opencontainers.image.version=0.0.0-pr.${{ github.event.number }}
        org.opencontainers.image.description=A proxy that implements the CouchDB replication protocol
      prepare: npm version "0.0.0-pr.${{ github.event.number }}" --no-git-tag-version --allow-same-version

  # TEMP test: really delete this PR's current (multi-platform) pr-<n> image before rebuilding it
  cleanup-test:
    uses: Aam-Digital/.github/.github/workflows/pr-image-cleanup.yml@feat/reusable-workflows
    permissions:
      packages: write
