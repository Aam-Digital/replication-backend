name: On PR (build & publish pre-release image)
on:
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      version: 0.0.0-pr.${{ github.event.number }}
      docker_tags: |
        type=raw,value=pr-${{ github.event.number }}
    permissions:
      contents: read
      packages: write
