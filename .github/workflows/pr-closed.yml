name: On PR closed (delete pre-release image)
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  # Check name: `cleanup-image / cleanup`
  cleanup-image:
    # PRs from forks have no image
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: Aam-Digital/.github/.github/workflows/image-cleanup.yml@v1
    permissions:
      actions: write # cancel a still running PR image build, which would otherwise push pr-<n> after the cleanup
      packages: write
    with:
      build-workflows: pr-release.yml
